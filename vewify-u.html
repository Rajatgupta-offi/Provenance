<style>
:root{
  --navy-950:#05070d; --navy-900:#080b14; --navy-850:#0b0f1c; --navy-800:#101627; --navy-700:#161d33;
  --border:#212a42; --border-soft:#1a2138;
  --text:#e9ecf5; --text-dim:#9aa3bd; --text-faint:#616c8c;
  --blue:#3d7bff; --blue-soft:#3d7bff22; --violet:#8b6bff; --violet-soft:#8b6bff22;
  --green:#2fbf78; --green-soft:#2fbf7822; --amber:#e9a23b; --amber-soft:#e9a23b22; --red:#ef5a6f; --red-soft:#ef5a6f22;
  --grad: linear-gradient(135deg,#3d7bff 0%,#8b6bff 100%);
  --radius:14px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{margin:0;background:var(--navy-950);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4,.disp{font-family:'Sora',system-ui,sans-serif;}
mono,.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;text-decoration:none}
::selection{background:var(--blue-soft);}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
.small-wrap{max-width:880px;margin:0 auto;padding:0 28px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:10px;font-weight:600;font-size:14.5px;cursor:pointer;border:1px solid transparent;transition:transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;white-space:nowrap;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 24px -8px #3d7bff66;}
.btn-primary:hover{box-shadow:0 10px 30px -6px #3d7bff88;}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text);}
.btn-ghost:hover{border-color:#3d7bff88;background:#3d7bff0d;}
.btn-soft{background:var(--navy-800);border-color:var(--border);color:var(--text);}
.btn-soft:hover{border-color:#3a4366;}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:8px;}
.btn-block{width:100%;}
.card{background:linear-gradient(180deg,#0d1220,#0a0e1a);border:1px solid var(--border);border-radius:var(--radius);}
.glass{background:rgba(16,22,39,.65);backdrop-filter:blur(14px);border:1px solid var(--border-soft);}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:100px;font-size:12px;font-weight:600;border:1px solid var(--border);color:var(--text-dim);}
.chip-blue{background:var(--blue-soft);color:#9db8ff;border-color:#3d7bff44;}
.chip-violet{background:var(--violet-soft);color:#c4b5ff;border-color:#8b6bff44;}
.chip-green{background:var(--green-soft);color:#7fe0ae;border-color:#2fbf7844;}
.chip-amber{background:var(--amber-soft);color:#f4c079;border-color:#e9a23b44;}
.chip-red{background:var(--red-soft);color:#ffa3b0;border-color:#ef5a6f44;}
input,textarea,select{background:var(--navy-800);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:11px 13px;font-family:inherit;font-size:14px;width:100%;outline:none;transition:border-color .15s;}
input:focus,textarea:focus,select:focus{border-color:#3d7bff99;}
input::placeholder,textarea::placeholder{color:var(--text-faint);}
label.field-label{font-size:12.5px;color:var(--text-dim);font-weight:600;margin-bottom:6px;display:block;}
.divider{height:1px;background:var(--border-soft);border:none;margin:0;}
.progress-track{height:8px;border-radius:100px;background:var(--navy-700);overflow:hidden;}
.progress-fill{height:100%;border-radius:100px;background:var(--grad);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;color:var(--text-faint);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:10px 14px;border-bottom:1px solid var(--border);}
td{padding:12px 14px;border-bottom:1px solid var(--border-soft);}
tr:last-child td{border-bottom:none;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#232c46;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
.fade-in{animation:fadeIn .35s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion: reduce){.fade-in{animation:none;}}
.sidebar-link{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:9px;color:var(--text-dim);font-size:14px;font-weight:500;cursor:pointer;transition:background .15s,color .15s;}
.sidebar-link:hover{background:var(--navy-800);color:var(--text);}
.sidebar-link.active{background:linear-gradient(90deg,#3d7bff1c,transparent);color:#fff;border-left:2px solid #3d7bff;padding-left:12px;}
.app-shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}
@media (max-width:860px){.app-shell{grid-template-columns:1fr;}.app-sidebar{display:none;}}
.hero-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(600px 300px at 20% 0%, #3d7bff22, transparent 60%),radial-gradient(500px 260px at 85% 10%, #8b6bff22, transparent 60%);}
.nav-top{position:sticky;top:0;z-index:40;background:rgba(5,7,13,.78);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-soft);}
.step-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:1px solid var(--border);color:var(--text-faint);flex-shrink:0;}
.step-dot.done{background:var(--green);border-color:var(--green);color:#04130a;}
.step-dot.now{background:var(--grad);border-color:transparent;color:#fff;}
.ev-node{cursor:pointer;transition:transform .15s;}
.ev-node:hover{transform:translateY(-2px);}
.qopt{display:block;width:100%;text-align:left;padding:13px 15px;border-radius:10px;border:1px solid var(--border);background:var(--navy-800);margin-bottom:9px;cursor:pointer;font-size:14.5px;transition:border-color .12s,background .12s;}
.qopt:hover{border-color:#3d7bff77;}
.qopt.correct{border-color:var(--green);background:var(--green-soft);}
.qopt.wrong{border-color:var(--red);background:var(--red-soft);}
.checklist-item{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14px;color:var(--text-dim);opacity:0;animation:fadeIn .4s ease forwards;}
.tabbtn{padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--text-dim);cursor:pointer;border:1px solid transparent;}
.tabbtn.active{background:var(--navy-800);color:#fff;border-color:var(--border);}
.skel{background:linear-gradient(90deg,#101627,#161d33,#101627);background-size:200% 100%;animation:skel 1.2s infinite;border-radius:8px;}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>

<script>
/* ===================== UTILITIES ===================== */
const $=(s,r=document)=>r.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
function uid(){return Math.random().toString(36).slice(2,9);}
function randHex(n){let s='';for(let i=0;i<n;i++)s+='0123456789ABCDEF'[Math.floor(Math.random()*16)];return s;}
function pct(n){return Math.round(clamp(n,0,100))+'%';}
function todayLong(){return new Date().toLocaleDateString('en-US',{day:'2-digit',month:'long',year:'numeric'});}
function nav(hash){location.hash=hash;window.scrollTo(0,0);}
function save(){localStorage.setItem('vwu_db',JSON.stringify(DB));}
function saveWiz(){localStorage.setItem('vwu_wiz',JSON.stringify(WIZ));}
function loadJSON(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch(e){return fb;}}

const LEVELS=['Beginner','Intermediate','Advanced','Expert'];
function levelIndex(l){return LEVELS.indexOf(l);}
function classify(score){ if(score>=90)return'Expert'; if(score>=73)return'Advanced'; if(score>=45)return'Intermediate'; return'Beginner'; }
function levelChip(l){ const map={Beginner:'chip-amber',Intermediate:'chip-blue',Advanced:'chip-violet',Expert:'chip-green'}; return `<span class="chip ${map[l]||'chip-blue'}">${l}</span>`; }
function confBand(n){ return n>=80?'High':n>=55?'Medium':'Low'; }
function confChip(n){ const b=confBand(n); const map={High:'chip-green',Medium:'chip-amber',Low:'chip-red'}; return `<span class="chip ${map[b]}">${b}</span>`; }

function ring(percent,size,color,thick){
  size=size||110; thick=thick||9; color=color||'#3d7bff';
  const r=(size-thick)/2, c=2*Math.PI*r, off=c*(1-clamp(percent,0,100)/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#161d33" stroke-width="${thick}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${thick}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}
function ringLabeled(percent,label,color,size){
  size=size||118;
  return `<div style="position:relative;width:${size}px;height:${size}px;">${ring(percent,size,color)}
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <div style="font-family:Sora;font-size:22px;font-weight:700;">${Math.round(percent)}%</div>
      <div style="font-size:11px;color:var(--text-faint);">${label}</div>
    </div></div>`;
}
function hbar(label,val,color,max){
  max=max||100;
  return `<div style="margin-bottom:12px;">
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;"><span style="color:var(--text-dim);">${esc(label)}</span><span style="font-weight:600;">${Math.round(val)}%</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${clamp(val/max*100,0,100)}%;background:${color||'var(--grad)'};"></div></div>
  </div>`;
}
function qrPattern(seedStr,size){
  size=size||150;
  let h=0; for(let i=0;i<seedStr.length;i++){h=(h*31+seedStr.charCodeAt(i))>>>0;}
  const n=11, cell=size/n; let rects='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    h=(h*1103515245+12345)>>>0;
    const onFinder=(x<3&&y<3)||(x>n-4&&y<3)||(x<3&&y>n-4);
    const on= onFinder ? ((x%2===0&&y%2===0)|| (x===1&&y===1) ) : (h%100<48);
    if(on) rects+=`<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="#0b0f1c"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="background:#fff;border-radius:10px;">${rects}</svg>`;
}
function toast(msg){
  let t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#111726;border:1px solid #2a3457;color:#e9ecf5;padding:12px 20px;border-radius:10px;font-size:13.5px;z-index:999;box-shadow:0 10px 30px -6px #000a;';
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}

/* ===================== DATA ===================== */
const SKILL_LIST=['Python','Java','SQL','Data Science','Machine Learning','JavaScript','React','C++','Cybersecurity'];
const SKILL_ABBR={'Python':'PY','Java':'JV','SQL':'SQ','Data Science':'DS','Machine Learning':'ML','JavaScript':'JS','React':'RX','C++':'CP','Cybersecurity':'CS'};

// ---- Python question bank (full depth per spec) ----
const PY_RAW=[
['Fundamentals',1,'MCQ','Which of these is NOT a valid Python variable name?',['_value','2total','total_2','Total'],1,'Identifiers cannot start with a digit.'],
['Fundamentals',1,'MCQ','What does the `type()` function return?',['The value of a variable','The memory address','The data type of an object','The length of an object'],2,'`type()` reports an object\'s class/type.'],
['Variables',1,'MCQ','What is the output of `x = 5; x += 3; print(x)`?',['5','8','53','Error'],1,'`+=` performs in-place addition: 5+3=8.'],
['Variables',2,'Code Output','What does `a, b = b, a` do when a=1, b=2?',['Causes an error','Swaps the values of a and b','Sets both to 1','Sets both to 2'],1,'Tuple unpacking swaps values without a temp variable.'],
['DataTypes',1,'MCQ','Which type is immutable in Python?',['list','dict','tuple','set'],2,'Tuples cannot be modified after creation.'],
['DataTypes',2,'MCQ','What is the result of `3 / 2` in Python 3?',['1','1.5','1.0','Error'],1,'The `/` operator always performs float division in Python 3.'],
['DataTypes',2,'MCQ','What is the result of `3 // 2`?',['1','1.5','2','Error'],0,'`//` is floor (integer) division.'],
['ControlFlow',1,'MCQ','Which keyword is used to exit a loop early?',['stop','exit','break','return'],2,'`break` immediately terminates the nearest enclosing loop.'],
['ControlFlow',2,'Code Output','What is printed by `for i in range(3): print(i)`?',['1 2 3','0 1 2','0 1 2 3','1 2'],1,'`range(3)` yields 0,1,2.'],
['ControlFlow',3,'Debugging','A `while` loop never terminates. What is the most likely cause?',['The condition never becomes False','Too many print statements','Using range() instead of while','Python has no while loops'],0,'An infinite loop occurs when the exit condition is never satisfied.'],
['Functions',1,'MCQ','What keyword defines a function in Python?',['func','def','function','lambda'],1,'`def` introduces a function definition.'],
['Functions',2,'MCQ','What does a function return if it has no explicit return statement?',['0','""','None','Error'],2,'Functions implicitly return `None`.'],
['Functions',3,'Code Completion','Which default-argument pattern avoids the classic mutable-default bug? Use `def f(x, items=___):`',['[]','None, then create list inside','{}','list()'],1,'Mutable defaults are evaluated once; use `None` then create the list inside the function.'],
['Lists',1,'MCQ','Which method adds an item to the end of a list?',['list.add()','list.append()','list.push()','list.insert(0,x)'],1,'`append()` adds a single element to the end.'],
['Lists',2,'Code Output','What is `[1,2,3][::-1]`?',['[3,2,1]','[1,2,3]','Error','[1,3]'],0,'Slicing with step -1 reverses the list.'],
['Lists',2,'MCQ','What is the time complexity of `list.append()` on average?',['O(n)','O(log n)','O(1) amortized','O(n^2)'],2,'Python lists are dynamic arrays; append is amortized O(1).'],
['Tuples',1,'MCQ','What is the key difference between a list and a tuple?',['Tuples are mutable, lists are not','Lists are mutable, tuples are not','Tuples cannot hold numbers','No difference'],1,'Tuples are immutable sequences; lists are mutable.'],
['Sets',2,'MCQ','What does `{1,2,3} & {2,3,4}` return?',['{1,2,3,4}','{2,3}','{1,4}','Error'],1,'`&` computes the set intersection.'],
['Dictionaries',1,'MCQ','How do you safely get a key that may not exist without raising an error?',['dict[key]','dict.get(key)','dict.find(key)','dict.key()'],1,'`.get()` returns None (or a default) instead of raising KeyError.'],
['Dictionaries',2,'Code Output','What does `{"a":1,"b":2}.items()` produce when iterated?',['Just the values','Just the keys','Key-value pairs as tuples','A list of dicts'],2,'`.items()` yields (key, value) tuples.'],
['Strings',1,'MCQ','What does `"Hello"[1:4]` return?',['Hell','ell','ello','Hello'],1,'Slicing [1:4] takes indices 1,2,3 → "ell".'],
['Strings',2,'MCQ','Which method splits a string into a list by whitespace?',['.split()','.divide()','.partition()','.slice()'],0,'`.split()` with no args splits on any whitespace.'],
['OOP',1,'MCQ','What does `self` refer to inside a class method?',['The class itself','The current instance','A global variable','Nothing, it is optional'],1,'`self` is the conventional name for the instance the method is called on.'],
['OOP',2,'MCQ','Which method is the constructor in a Python class?',['__new__','__init__','__start__','constructor()'],1,'`__init__` initializes a newly created instance.'],
['OOP',3,'Conceptual','What is the main benefit of inheritance?',['Faster execution','Reusing and extending existing class behavior','Reducing memory usage','Avoiding functions'],1,'Inheritance lets a subclass reuse and extend a parent class\'s behavior.'],
['Exceptions',1,'MCQ','Which block always runs, whether or not an exception occurred?',['try','except','finally','else'],2,'`finally` executes regardless of whether an exception was raised.'],
['Exceptions',2,'Debugging','What is wrong with `except:` (bare except)?',['Nothing, it is best practice','It silently catches all errors, hiding bugs','It only catches ValueError','It is a syntax error'],1,'Bare except swallows all exceptions including system-exiting ones, hiding real bugs.'],
['FileHandling',1,'MCQ','Which statement automatically closes a file after use?',['open()','with open() as f:','file.read()','close(file)'],1,'The `with` context manager closes the file automatically on exit.'],
['Algorithms',2,'MCQ','What is the time complexity of binary search?',['O(n)','O(n log n)','O(log n)','O(1)'],2,'Binary search halves the search space each step: O(log n).'],
['Algorithms',3,'Debugging','Binary search on an unsorted list returns wrong results. Why?',['Binary search requires a sorted input','Python lists cannot be searched','The list is too short','Binary search only works on tuples'],0,'Binary search assumes the collection is sorted; on unsorted data results are undefined.'],
['DataStructures',2,'MCQ','Which structure is best for LIFO (last-in-first-out) access?',['Queue','Stack','Dictionary','Set'],1,'A stack naturally supports LIFO push/pop operations.'],
['NumPy',2,'MCQ','What does `np.array([1,2,3]) * 2` produce?',['[1,2,3,1,2,3]','[2,4,6]','Error','[1,2,3,2]'],1,'NumPy arrays broadcast scalar multiplication element-wise.'],
['NumPy',3,'Conceptual','What is "broadcasting" in NumPy?',['Sending data over a network','Automatically expanding shapes for element-wise ops','Copying arrays to the GPU','Printing array contents'],1,'Broadcasting lets NumPy operate on arrays of different but compatible shapes.'],
['Pandas',2,'MCQ','Which method fills missing values with the column mean?',['df.fillna(df.mean())','df.dropna()','df.mean().fillna()','df.replace(mean)'],0,'`fillna(df.mean())` replaces NaNs with each column\'s mean.'],
['Pandas',2,'MCQ','Which method removes rows with missing values?',['df.dropna()','df.fillna()','df.remove()','df.clean()'],0,'`dropna()` drops rows (or columns) containing NaN by default.'],
['Pandas',3,'Scenario Based','A DataFrame has a skewed distribution with outliers. Why might filling missing values with the mean be risky?',['It is always the best choice','The mean is sensitive to outliers and can distort the distribution','Pandas does not support mean()','It changes the column dtype to string'],1,'With skew/outliers the mean is pulled away from the typical value; median is often more robust.'],
['DataCleaning',2,'MCQ','What is the first recommended step when receiving a new dataset?',['Train a model immediately','Inspect shape, types, and missing values','Delete all rows with any NaN','Normalize all columns'],1,'Understanding structure and data quality should come before analysis or modeling.'],
['EDA',2,'MCQ','Which chart best shows the relationship between two continuous variables?',['Bar chart','Scatter plot','Pie chart','Histogram'],1,'Scatter plots reveal correlation/relationship patterns between two numeric variables.'],
['Debugging',2,'Error Identification','`for i in range(len(list)): print(list[i]` — what is the bug?',['Missing colon after for','Missing closing parenthesis','range() is misspelled','list is a reserved word only'],1,'The print call is missing its closing parenthesis.'],
['Statistics',2,'MCQ','Which measure is most robust to outliers?',['Mean','Median','Range','Standard deviation'],1,'The median is not pulled by extreme values the way the mean is.'],
['MLBasics',2,'MCQ','What is "overfitting"?',['A model that performs well on new, unseen data','A model that memorizes training data and fails to generalize','A model that trains too quickly','A dataset that is too small'],1,'Overfitting means high training performance but poor generalization to unseen data.'],
['MLBasics',3,'Conceptual','Why is a train/test split used?',['To make training faster','To estimate how the model performs on unseen data','To reduce the dataset size for storage','It is required by Python syntax'],1,'Held-out test data approximates real-world generalization performance.'],
];
function buildQ(raw,skill){return raw.map((r,i)=>({id:skill+'_'+i,skill,cat:r[0],diff:r[1],type:r[2],q:r[3],opts:r[4],ans:r[5],exp:r[6]}));}
const PY_BANK=buildQ(PY_RAW,'Python');

// generic-ish per-skill compact banks
const OTHER_RAW={
'Java':[['Fundamentals',1,'MCQ','What keyword defines a class in Java?',['class','struct','define','object'],0,'`class` declares a Java class.'],
['OOP',2,'MCQ','What does the `extends` keyword do?',['Implements an interface','Inherits from a superclass','Imports a package','Overloads a method'],1,'`extends` is used for class inheritance.'],
['DataTypes',1,'MCQ','Which is a primitive type in Java?',['String','int','ArrayList','Object'],1,'`int` is a primitive numeric type; String is a reference type.'],
['ControlFlow',2,'Code Output','What does `for(int i=0;i<3;i++) System.out.print(i);` print?',['123','012','0 1 2 3','Error'],1,'Loop runs for i=0,1,2 printing 012.'],

function viewOverview(){
  const skills=DB.skills;
  const verified=skills.filter(s=>s.status==='verified');
  const inProgress=skills.filter(s=>s.status!=='verified');
  const evCount=skills.reduce((a,s)=>a+ (s.evidence?Object.values(s.evidence).filter(v=>v&&v!==false).length:0),0);
  const avgAssess= skills.length? Math.round(skills.reduce((a,s)=>a+(s.assessment||0),0)/skills.length):0;
  const strength=clamp(20+verified.length*15+skills.length*5,0,100);
  const stats=[['Verified Skills',verified.length,'var(--green)'],['Skills in Progress',inProgress.length,'var(--amber)'],['Evidence Items',evCount,'var(--blue)'],['Assessment Score',avgAssess+'%','var(--violet)'],['Profile Strength',strength+'%','#7fe0ae']];
  const hour=new Date().getHours(); const greet= hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
  const content=`${appTopbar(greet+', '+DB.candidate.name.split(' ')[0], DB.candidate.title)}
  <div class="wrap" style="max-width:1040px;padding:26px 30px 60px;margin:0;">
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:26px;">

    </div>
    ${skills.length===0?`
      <div class="card" style="padding:44px;text-align:center;">
        <div style="font-size:15px;font-weight:600;margin-bottom:8px;">No skills verified yet</div>
        <div style="color:var(--text-dim);font-size:13.5px;margin-bottom:20px;max-width:400px;margin-left:auto;margin-right:auto;">Add your first skill claim and walk through evidence, assessment, and a real-world challenge to get a demonstrated result.</div>
        <button class="btn btn-primary" onclick="nav('#/app/add')">Add / Verify Skill</button>
      </div>`:
      `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h3 class="disp" style="font-size:17px;margin:0;">Your skills</h3>
        <button class="btn btn-primary btn-sm" onclick="nav('#/app/add')">+ Add skill</button>

  return appShell('overview','candidate',content);

function fillCert(kind){
  const map={
    valid:{name:DB.candidate.name,title:'Python for Data Analysis',id:'VWU-CERT-88213',issuer:'Coursera'},
    invalid:{name:DB.candidate.name,title:'Advanced SQL',id:'INVALID-000',issuer:'Udemy'},
    mismatch:{name:'Someone Else',title:'Java Fundamentals',id:'VWU-CERT-44921',issuer:'edX'},
    unknown:{name:DB.candidate.name,title:'Machine Learning Basics',id:'VWU-CERT-77123',issuer:''},
  }[kind];
  $('#cf-name').value=map.name; $('#cf-title').value=map.title; $('#cf-id').value=map.id; $('#cf-issuer').value=map.issuer;

function runCertVerify(){
  const name=$('#cf-name').value.trim()||DB.candidate.name, title=$('#cf-title').value.trim()||'Certificate', id=$('#cf-id').value.trim(), issuer=$('#cf-issuer').value.trim();
  let status='Verified', note='Credential authenticity verified.', conf=90;
  if(name.toLowerCase()!==DB.candidate.name.toLowerCase()){ status='Identity mismatch'; note='The name on the certificate does not match the candidate profile.'; conf=15; }
  else if(id.toUpperCase().includes('INVALID')||id.length<5){ status='Could not verify'; note='Certificate ID could not be matched against issuer records.'; conf=25; }
  else if(!issuer){ status='External verification unavailable'; note='Issuer records could not be reached to confirm this credential.'; conf=45; }
  WIZ.evidence.certificate={certName:title,certId:id,issuer:issuer||'Unknown',status,note,confidence:conf};
  openEv=null; saveWiz(); render(); toast('Certificate check complete: '+status);
}

  if(openEv!=='project') return '';

function runProjectVerify(){
  const title=$('#pj-title').value.trim()||'Untitled project', tech=$('#pj-tech').value.trim(), desc=$('#pj-desc').value.trim(), role=$('#pj-role').value.trim(), contrib=Number($('#pj-contrib').value)||0;
  const complexKeywords=['api','model','pipeline','database','deploy','test','architecture','scale','microservice','algorithm'];
  const hits=complexKeywords.filter(k=>desc.toLowerCase().includes(k)).length;
  const confidence=clamp(contrib*0.5 + hits*6 + (desc.length>120?15:desc.length>40?7:0),0,100);
  WIZ.evidence.project={title,tech,desc,role,contrib,confidence:Math.round(confidence)};

function wizNext(fromStep){
  if(fromStep===1 && !WIZ.skill && !WIZ.customSkill.trim()){ toast('Select or enter a skill first.'); return; }

  WIZ.step=fromStep+1; if(WIZ.step===4){ WIZ.ghChecklistDone=false; WIZ.certChecklistDone=false; } saveWiz(); render();
  if(fromStep===3) setTimeout(runVerificationAnimation,60);
}

function wizStep4(){
  const ev=WIZ.evidence;
  let blocks='';
  if(ev.github) blocks+=githubReportBlock(ev.github);
  if(ev.certificate) blocks+=certReportBlock(ev.certificate);
  if(ev.project) blocks+=projectReportBlock(ev.project);
  if(!ev.github&&!ev.certificate&&!ev.project) blocks=`<div class="card" style="padding:22px;color:var(--text-dim);font-size:13.5px;">No evidence submitted. Evidence confidence will be based primarily on assessment and practical performance.</div>`;
  return `<div id="verify-anim"></div><div id="verify-reports">${blocks}</div>
  <div style="display:flex;justify-content:space-between;margin-top:24px;">
    <button class="btn btn-soft" onclick="wizBack()">← Back</button>
    <button class="btn btn-primary" onclick="wizNext(4)">Continue to assessment →</button>
  </div>`;
}
function runVerificationAnimation(){
  const el=$('#verify-anim'); if(!el) return;
  const steps=['Repository Found','Repository Accessible','Commit History Analyzed','Candidate Contribution Analyzed','Technologies Detected','Project Complexity Analyzed','Skill Relevance Analyzed','Documentation Analyzed','Testing Analyzed'];
  const has=WIZ.evidence.github||WIZ.evidence.certificate||WIZ.evidence.project;
  if(!has) return;
  const list=WIZ.evidence.github?steps: (WIZ.evidence.certificate? ['Document Extracted','OCR Applied','Identity Match Checked','Certificate ID Checked','Issuer Checked','Date Checked','Verification URL Checked','Skill Relevance Checked'] : ['Project Details Parsed','Technology Relevance Analyzed','Complexity Estimated','Contribution Assessed','Skill Relevance Analyzed']);
  el.innerHTML=`<div class="card" style="padding:20px;margin-bottom:14px;"><div style="font-weight:600;margin-bottom:10px;font-size:13.5px;">Running authenticity checks…</div><div id="ck-list"></div></div>`;
  const ck=$('#ck-list');
  list.forEach((s,i)=>{ setTimeout(()=>{ const d=document.createElement('div'); d.className='checklist-item'; d.innerHTML=`<span style="color:#7fe0ae;">✓</span> ${s}`; ck.appendChild(d); },i*180); });
}
function githubReportBlock(g){
  return `<div class="card" style="padding:22px;margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;"><div style="font-weight:700;">GitHub Evidence Report</div>${confChip(g.confidence)}</div>

/* Step 5: Adaptive Assessment */
function wizStep5(){
  if(!WIZ.quiz){
    const skill=WIZ.skill||WIZ.customSkill;
    const pool=bankFor(skill).slice();
    WIZ.quiz={pool,asked:[],results:[],difficulty:2,streakC:0,streakW:0,total:10,current:null,catWrong:{},finished:false};
    WIZ.quiz.current=pickNextQuestion(WIZ.quiz);
    saveWiz();
  }
  const qz=WIZ.quiz;
  if(qz.finished) return assessmentSummary();
  const q=qz.current;
  return `<div class="card" style="padding:26px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <span class="chip chip-blue">${q.cat}</span>
      <div style="font-size:12.5px;color:var(--text-faint);">Question ${qz.results.length+1} of ${qz.total} · Difficulty: ${['','Beginner','Intermediate','Advanced'][q.diff]}</div>
    </div>
    <div style="font-size:11.5px;color:var(--text-faint);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em;">${q.type}</div>
    <div style="font-size:16px;font-weight:600;margin-bottom:20px;line-height:1.5;white-space:pre-wrap;">${esc(q.q)}</div>
    <div id="qopts">${q.opts.map((o,i)=>`<div class="qopt" onclick="answerQ(${i})">${esc(o)}</div>`).join('')}</div>
    <div class="progress-track" style="margin-top:20px;"><div class="progress-fill" style="width:${qz.results.length/qz.total*100}%;"></div></div>
  </div>`;
}
function pickNextQuestion(qz){
  const unused=qz.pool.filter(p=>!qz.asked.includes(p.id));
  if(unused.length===0){ qz.asked=[]; return pickNextQuestion(qz); }
  const weakCat=Object.entries(qz.catWrong).sort((a,b)=>b[1]-a[1])[0];
  let candidates;
  if(weakCat && weakCat[1]>0 && Math.random()<0.4){ candidates=unused.filter(p=>p.cat===weakCat[0]); }
  if(!candidates||!candidates.length) candidates=unused.filter(p=>p.diff===qz.difficulty);
  if(!candidates.length) candidates=unused.filter(p=>Math.abs(p.diff-qz.difficulty)<=1);
  if(!candidates.length) candidates=unused;
  return candidates[Math.floor(Math.random()*candidates.length)];
}
function answerQ(i){
  const qz=WIZ.quiz, q=qz.current, correct=i===q.ans;
  const opts=document.querySelectorAll('#qopts .qopt');
  opts.forEach((o,idx)=>{ if(idx===q.ans) o.classList.add('correct'); else if(idx===i && !correct) o.classList.add('wrong'); o.style.pointerEvents='none'; });
  qz.results.push({id:q.id,cat:q.cat,diff:q.diff,correct});
  qz.asked.push(q.id);
  if(!correct) qz.catWrong[q.cat]=(qz.catWrong[q.cat]||0)+1;
  if(correct){ qz.streakC++; qz.streakW=0; if(qz.streakC>=2){ qz.difficulty=Math.min(3,qz.difficulty+1); qz.streakC=0; } }
  else { qz.streakW++; qz.streakC=0; if(qz.streakW>=2){ qz.difficulty=Math.max(1,qz.difficulty-1); qz.streakW=0; } }
  saveWiz();
  setTimeout(()=>{
    if(qz.results.length>=qz.total){ qz.finished=true; computeAssessmentScore(); }
    else { qz.current=pickNextQuestion(qz); }
    saveWiz(); render();
  },650);
}
function computeAssessmentScore(){
  const qz=WIZ.quiz;
  let got=0,possible=0; const catTotals={}, catCorrect={};
  qz.results.forEach(r=>{ const w=r.diff; possible+=w; if(r.correct)got+=w; catTotals[r.cat]=(catTotals[r.cat]||0)+1; if(r.correct)catCorrect[r.cat]=(catCorrect[r.cat]||0)+1; });
  const score=Math.round(got/possible*100);
  const catScores={}; Object.keys(catTotals).forEach(c=>catScores[c]=Math.round((catCorrect[c]||0)/catTotals[c]*100));
  qz.score=score; qz.catScores=catScores;
  saveWiz();
}
function assessmentSummary(){
  const qz=WIZ.quiz;
  const strong=Object.entries(qz.catScores).filter(([k,v])=>v>=75).map(x=>x[0]);
  const weak=Object.entries(qz.catScores).filter(([k,v])=>v<60).map(x=>x[0]);
  return `<div class="card" style="padding:28px;">
    <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;">
      ${ringLabeled(qz.score,'Overall',qz.score>=73?'#2fbf78':qz.score>=45?'#e9a23b':'#ef5a6f',120)}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;">
      <div><div style="font-size:12px;color:var(--text-faint);margin-bottom:6px;">Strong areas</div>${strong.length?strong.map(s=>`<span class="chip chip-green" style="margin:2px;">${s}</span>`).join(''):'<span style="color:var(--text-faint);font-size:12.5px;">None yet</span>'}</div>
      <div><div style="font-size:12px;color:var(--text-faint);margin-bottom:6px;">Weak areas</div>${weak.length?weak.map(s=>`<span class="chip chip-red" style="margin:2px;">${s}</span>`).join(''):'<span style="color:var(--text-faint);font-size:12.5px;">None yet</span>'}</div>
    </div>
  </div>
  <div style="display:flex;justify-content:space-between;margin-top:24px;">
    <button class="btn btn-soft" onclick="wizBack()">← Back</button>
    <button class="btn btn-primary" onclick="wizNext(5)">Continue to practical challenge →</button>
  </div>`;
}

function toggleRegion(r){ const s=WIZ.practical.regionsSel; const i=s.indexOf(r); if(i>-1)s.splice(i,1); else s.push(r); saveWiz(); render(); }
function retailxViz(){
  const regions=RETAILX.regions, months=RETAILX.months;
  const maxV=Math.max(...Object.values(regions).flat());
  const colors={North:'#3d7bff',South:'#2fbf78',East:'#e9a23b',West:'#8b6bff'};
  const w=560,h=220,pad=30, groupW=(w-pad*2)/months.length;
  let bars='';
  months.forEach((m,mi)=>{
    const keys=Object.keys(regions); const bw=(groupW-10)/keys.length;
    keys.forEach((r,ri)=>{
      const val=regions[r][mi]; const bh=(val/maxV)*(h-50);
      const x=pad+mi*groupW+ri*bw; const y=h-30-bh;
      bars+=`<rect x="${x}" y="${y}" width="${bw-2}" height="${bh}" fill="${colors[r]}" rx="2"/>`;
    });
    bars+=`<text x="${pad+mi*groupW+groupW/2-8}" y="${h-10}" fill="#616c8c" font-size="10">${m}</text>`;
  });
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" style="max-width:${w}px;">${bars}</svg>
  <div style="display:flex;gap:14px;margin:10px 0 18px;flex-wrap:wrap;">${Object.keys(regions).map(r=>`<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);"><span style="width:9px;height:9px;border-radius:2px;background:${colors[r]};display:inline-block;"></span>${r}</div>`).join('')}</div>

}

function submitPractical(){
  const p=WIZ.practical;
  const dataPrep=clamp((p.cleaningNotes.length>100?20:p.cleaningNotes.length>30?12:4) + (/missing|null|duplicate|outlier/i.test(p.cleaningNotes)?4:0),0,20);
  const correctSet=RETAILX.decliningRegions;
  const hitRatio= p.regionsSel.length? p.regionsSel.filter(r=>correctSet.includes(r)).length/correctSet.length - p.regionsSel.filter(r=>!correctSet.includes(r)).length*0.15 : 0;
  const analysis=clamp(hitRatio*14 + (p.findings.length>100?6:p.findings.length>30?3:0),0,20);
  const kwHits=RETAILX.keywords.filter(k=>(p.findings+p.recommendation).toLowerCase().includes(k)).length;
  const problemSolving=clamp(kwHits*3+ (p.findings.length>80?4:0),0,20);
  const codeQuality=clamp((/\d\.|•|-\s/.test(p.cleaningNotes)?9:4)+(p.cleaningNotes.length>60?6:0),0,15);
  const visualization=clamp(p.chartInsight.length>60?10:p.chartInsight.length>20?6:2,0,10);
  const reasoning=clamp((/because|due to|suggests|indicates|likely|driven by/i.test(p.findings+p.recommendation)?7:2)+(p.findings.length>60?3:0),0,10);
  const bizRec=clamp((/increase|launch|reduce|target|improve|invest|reallocate|promotion/i.test(p.recommendation)?4:1)+(p.recommendation.length>40?1:0),0,5);
  const total=Math.round(dataPrep+analysis+problemSolving+codeQuality+visualization+reasoning+bizRec);
  p.submitted=true;
  p.scores={dataPrep,analysis,problemSolving,codeQuality,visualization,reasoning,bizRec,total};
  p.feedback=[];
  p.feedback.push(dataPrep>=14?'Strong data cleaning approach.':'Data cleaning notes could be more thorough — name specific checks.');
  p.feedback.push(hitRatio>0.5?'Good trend identification across the correct declining regions.':'Analysis could better identify which regions are actually declining.');
  p.feedback.push(problemSolving>=12?'Problem-solving reasoning connects to plausible business causes.':'Findings could tie more directly to concrete causes (inventory, pricing, competition, churn).');
  p.feedback.push(bizRec>=4?'Recommendation is specific and actionable.':'Recommendation is relevant but could be more specific and supported by evidence.');
  saveWiz(); render();
}

function generateUnderstandingQuestions(){

  WIZ.understanding.questions=qs.slice(0,5);

function setUAnswer(i,v){ WIZ.understanding.answers[i]=v; saveWiz(); }
function submitUnderstanding(){
  const u=WIZ.understanding, p=WIZ.practical, ev=WIZ.evidence;
  const refPool=[(p.findings||''),(p.recommendation||''),(p.chartInsight||''),(ev.project?ev.project.desc:''),(ev.github?ev.github.lang.map(l=>l[0]).join(' '):'')].join(' ').toLowerCase();
  let scores=u.questions.map((q,i)=>{
    const a=(u.answers[i]||'').trim();
    let s=clamp(a.length/140*70,0,70);
    const words=a.toLowerCase().split(/\W+/).filter(w=>w.length>4);
    const overlap=words.filter(w=>refPool.includes(w)).length;
    s+=clamp(overlap*4,0,30);
    return Math.round(clamp(s,0,100));
  });
  const score= scores.length? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  u.result={score,perQ:scores};
  saveWiz(); render();
}

function computeFinal(){
  const skill=WIZ.skill||WIZ.customSkill; const ev=WIZ.evidence;
  const assessment=WIZ.quiz?WIZ.quiz.score:0;
  const practical=WIZ.practical.scores?WIZ.practical.scores.total:0;
  const understanding=WIZ.understanding.result?WIZ.understanding.result.score:0;
  let evidenceConfidence;
  if(ev.none || (!ev.github&&!ev.certificate&&!ev.project)){
    evidenceConfidence=Math.round(30+ (assessment+practical+understanding)/3*0.5);
  } else {
    let parts=[]; let weightSum=0;
    if(ev.github){parts.push(ev.github.confidence*0.4);weightSum+=0.4;}
    if(ev.certificate){parts.push((ev.certificate.status==='Verified'?95:ev.certificate.status==='External verification unavailable'?55:20)*0.35);weightSum+=0.35;}
    if(ev.project){parts.push(ev.project.confidence*0.25);weightSum+=0.25;}
    evidenceConfidence=Math.round(parts.reduce((a,b)=>a+b,0)/weightSum);
    evidenceConfidence+=Math.min(10,(ev.extras||[]).length*3);
  }
  evidenceConfidence=clamp(evidenceConfidence,0,100);
  const weighted=assessment*0.4+practical*0.35+understanding*0.25;
  const demonstratedLevel=classify(weighted);
  const claimIdx=levelIndex(WIZ.claim), demIdx=levelIndex(demonstratedLevel);
  let gapNote='';
  if(demIdx>claimIdx) gapNote='Performance exceeds claimed level.';
  else if(demIdx<claimIdx) gapNote=`Claim: ${WIZ.claim} · Demonstrated: ${demonstratedLevel} — gap of ${claimIdx-demIdx} level${claimIdx-demIdx>1?'s':''}.`;
  else gapNote='Demonstrated performance matches the claimed level.';
  const skillId=uid();
  const verificationId=`VWU-${(SKILL_ABBR[skill]||skill.slice(0,2).toUpperCase())}-${randHex(6)}`;
  WIZ.final={skillId,verificationId,demonstratedLevel,assessment,practical,understanding,evidenceConfidence,gapNote};
  const record={
    id:skillId, skill, claim:WIZ.claim, evidence:ev, assessment, categoryScores:WIZ.quiz?WIZ.quiz.catScores:{},
    practical, practicalBreakdown:WIZ.practical.scores?{
      'Data preparation':{score:WIZ.practical.scores.dataPrep,max:20},'Analysis':{score:WIZ.practical.scores.analysis,max:20},
      'Problem solving':{score:WIZ.practical.scores.problemSolving,max:20},'Code quality':{score:WIZ.practical.scores.codeQuality,max:15},
      'Visualization':{score:WIZ.practical.scores.visualization,max:10},'Reasoning':{score:WIZ.practical.scores.reasoning,max:10},'Business rec.':{score:WIZ.practical.scores.bizRec,max:5}
    }:null,
    practicalFeedback:WIZ.practical.feedback||[],
    understanding, understandingQuestions:WIZ.understanding.questions, understandingAnswers:WIZ.understanding.answers,
    evidenceConfidence, demonstratedLevel, verificationId, verifiedDate:todayLong(), status:'verified', gapNote,
  };
  DB.skills=DB.skills.filter(s=>!(s.skill===skill && s.status!=='verified'));
  DB.skills.push(record);
  DB.registry.push({verificationId,candidateName:DB.candidate.name,skill,claimLevel:WIZ.claim,demonstratedLevel,assessment,practical,understanding,evidenceConfidence,verifiedDate:todayLong(),status:'VERIFIED'});
  save(); saveWiz();
}

let COMPARE_SEL=[];
function viewCompare(){
  const content=`${appTopbar('Compare Candidates','Select 2–3 candidates to compare side by side')}
  <div class="wrap" style="max-width:1040px;padding:26px 30px 70px;margin:0;">
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;">
      ${RECRUITER_DEMO.map(c=>`<span class="chip ${COMPARE_SEL.includes(c.id)?'chip-blue':''}" style="cursor:pointer;" onclick="toggleCompare('${c.id}')">${c.name}</span>`).join('')}
    </div>
    ${COMPARE_SEL.length<2?`<div class="card" style="padding:30px;text-align:center;color:var(--text-dim);">Select at least 2 candidates above to compare.</div>`:
    `<div class="card" style="overflow:auto;"><table><thead><tr><th>Metric</th>${COMPARE_SEL.map(id=>`<th>${esc(RECRUITER_DEMO.find(c=>c.id===id).name)}</th>`).join('')}</tr></thead><tbody>
      ${[['Skill','skill'],['Claim','claim',1],['Demonstrated','demonstrated',1],['Assessment','assessment',2],['Practical','practical',2],['Understanding','understanding',2],['Evidence Confidence','evidenceConfidence',3],['Status','status']]
      .map(m=>`<tr><td style="color:var(--text-dim);">${m[0]}</td>${COMPARE_SEL.map(id=>{const c=RECRUITER_DEMO.find(x=>x.id===id); const v=c[m[1]]; return `<td>${m[2]===1?levelChip(v):m[2]===2?v+'%':m[2]===3?confChip(v)+' '+v+'%':esc(v)}</td>`;}).join('')}</tr>`).join('')}
    </tbody></table></div>`}
  </div>`;
  return appShell('compare','recruiter',content);
}
function toggleCompare(id){ const i=COMPARE_SEL.indexOf(id); if(i>-1)COMPARE_SEL.splice(i,1); else if(COMPARE_SEL.length<3)COMPARE_SEL.push(id); else toast('Compare up to 3 candidates.'); render(); }

/* ===================== ROUTER ===================== */
function render(){
  const h=location.hash||'#/';
  const parts=h.replace('#/','').split('/').filter(Boolean);
  let html='';
  try{
    if(h==='#/'||h==='') html=viewLanding();
    else if(h==='#/how') html=viewHow();
    else if(h==='#/candidates') html=viewCandidatesInfo();
    else if(h==='#/recruiters-info') html=viewRecruitersInfo();
    else if(h==='#/login') html=viewLogin();
    else if(h==='#/signup') html=viewSignup();
    else if(parts[0]==='verify') html=viewVerify(parts[1]);
    else if(h==='#/app'||h==='#/app/overview') html=viewOverview();
    else if(h==='#/app/skills') html=viewSkills();
    else if(h==='#/app/add') html=viewAdd();
    else if(h==='#/app/evidence') html=viewEvidence();
    else if(h==='#/app/assessments') html=viewAssessments();
    else if(h==='#/app/challenges') html=viewChallenges();
    else if(h==='#/app/profile') html=viewProfile();
    else if(parts[0]==='app'&&parts[1]==='skill') html=viewSkillDetail(parts[2]);
    else if(parts[0]==='app'&&parts[1]==='passport') html=viewPassport(parts[2]);
    else if(h==='#/app/passport') html=viewPassport(null);
    else if(h==='#/recruiter'||h==='#/recruiter/overview') html=viewRecruiterOverview();
    else if(h==='#/recruiter/search') html=viewSearch();
    else if(h==='#/recruiter/candidates') html=viewRecruiterCandidates();
    else if(parts[0]==='recruiter'&&parts[1]==='candidate') html=viewCandidateDetail(parts[2]);
    else if(h==='#/recruiter/compare') html=viewCompare();
    else html=viewLanding();
  }catch(e){ console.error(e); html=`<div class="wrap" style="padding:60px;">Something went wrong rendering this page. <a href="#/" style="color:#8fb0ff;">Return home</a><div class="mono" style="color:var(--text-faint);font-size:11px;margin-top:14px;">${esc(e.message)}</div></div>`; }
  $('#app').innerHTML=html;
  window.scrollTo(0,0);
  if(location.hash.indexOf('#/app/add')===0 && WIZ.step===4) setTimeout(runVerificationAnimation,80);
}
window.addEventListener('hashchange',render);
window.addEventListener('DOMContentLoaded',render);
render();
</script>
</body>
</html>
